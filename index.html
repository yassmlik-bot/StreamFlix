<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>StreamFlix</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="nav">
	<h1 class="logo">StreamFlix</h1>
	<nav>
		<a href="#">Accueil</a>
		<a href="#catalogue">Films</a>
	</nav>
	<div class="nav-actions">
		<input class="search" type="search" placeholder="Rechercher" oninput="searchMovie()">
		<div class="avatar-wrap">
			<img class="user-avatar" src="https://i.pravatar.cc/40?img=3" alt="avatar">

			<div class="avatar-menu" id="avatarMenu" aria-hidden="true">
				<a href="profile.html">Profil</a>
				<a href="#">Compte</a>
				<a href="#" id="logoutBtn">Se déconnecter</a>
			</div>
		</div>
	</div>
</header>

<section class="hero">
<div class="hero-content">
<h1>Films illimités</h1>
<p>Regarde tes films préférés en streaming</p>
<a href="#catalogue" class="btn">Explorer</a>
</div>
</section>

<h2 class="title">🔥 Tendances</h2>

<section class="grid" id="catalogue">

<div class="card" data-title="Avatar" onclick="openMovie('avatar.html')">
<img src="https://miro.medium.com/1*C1QI1XRKqZXEjTd4tPOQrQ.jpeg" alt="Avatar">
<div class="overlay">
<p>Avatar</p>
<a class="btn-watch" href="avatar.html" onclick="openMovie('avatar.html')">Regarder</a>
</div>
</div>

<div class="card" data-title="Joker" onclick="openMovie('joker.html')">
<img src="https://m.media-amazon.com/images/M/MV5BNzY3OWQ5NDktNWQ2OC00ZjdlLThkMmItMDhhNDk3NTFiZGU4XkEyXkFqcGc@._V1_.jpg" alt="Joker">
<div class="overlay">
<p>Joker</p>
<a class="btn-watch" href="joker.html" onclick="openMovie('joker.html')">Regarder</a>
</div>
</div>

<div class="card" data-title="Avengers" onclick="openMovie('avengers.html')">
<img src="https://m.media-amazon.com/images/I/81ExhpBEbHL.jpg" alt="Avengers">
<div class="overlay">
<p>Avengers</p>
<a class="btn-watch" href="avengers.html" onclick="openMovie('avengers.html')">Regarder</a>
</div>
</div>

</section>
<p class="no-results hidden">Aucun titre trouvé.</p>

<script src="script.js"></script>
</body>
</html>
